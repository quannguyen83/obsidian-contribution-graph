name: Release Obsidian plugin

on:
  push:
    branches: [master]
    paths: [manifest.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install, test and build
        run: |
          npm ci
          node tests/sketch-smoke.cjs
          npm run build
      - name: Publish BRAT release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version=$(node -p "require('./manifest.json').version")
          node -e "if(require('./package.json').version !== require('./manifest.json').version) process.exit(1)"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists; leaving it unchanged."
            exit 0
          fi
          cat > release-notes.md <<'NOTES'
          All sketch cell and legend outlines now use Thick (2px), regardless of the fill stroke setting.

          Thin/Medium/Thick controls only interior fill strokes. The control is now labeled Fill stroke width.

          BRAT repository: `quannguyen83/obsidian-contribution-graph`.
          Validation: TypeScript build and DOM regression tests passed.
          NOTES
          gh release create "$version" main.js manifest.json styles.css \
            --target "$GITHUB_SHA" --title "$version — Sketch Contribution Graph" \
            --notes-file release-notes.md --latest
