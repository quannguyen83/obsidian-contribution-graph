name: Release Obsidian plugin

on:
  push:
    branches: [master]
    paths: [manifest.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install, test and build
        run: |
          npm ci
          node tests/sketch-smoke.cjs
          npm run build
      - name: Publish BRAT release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version=$(node -p "require('./manifest.json').version")
          node -e "if(require('./package.json').version !== require('./manifest.json').version) process.exit(1)"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists; leaving it unchanged."
            exit 0
          fi
          cat > release-notes.md <<'NOTES'
          Renames this fork to Sketch Contribution Graph with a separate plugin ID.

          - Solid, Hachure and Cross-hatch fills.
          - Architect, Artist and Cartoonist sloppiness.
          - Thin, Medium and Thick strokes.
          - Available under Style Settings → Drawing style → Excalidraw-style.
          - Supports all three layouts and color legends; Standard remains the default.

          BRAT repository: `quannguyen83/obsidian-contribution-graph`.
          Plugin ID: `sketch-contribution-graph`. Command: Add Sketch Heatmap.
          Codeblock: `sketchContributionGraph`. API: `renderSketchContributionGraph`.
          Upgrading from 0.12.0: remove and re-add the BRAT entry, then update the codeblock/API names in your notes. Configuration is unchanged.
          Upstream: vran-dev/obsidian-contribution-graph. Drawing options adapted from Excalidraw using Rough.js.

          Validation: TypeScript build and DOM regression checks passed. Not yet visually verified inside Obsidian.
          NOTES
          gh release create "$version" main.js manifest.json styles.css \
            --target "$GITHUB_SHA" --title "$version — Sketch Contribution Graph" \
            --notes-file release-notes.md --latest
