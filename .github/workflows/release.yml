name: Release Obsidian plugin

on:
  push:
    branches: [master]
    paths: [manifest.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install, test and build
        run: |
          npm ci
          node tests/sketch-smoke.cjs
          npm run build
      - name: Publish BRAT release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version=$(node -p "require('./manifest.json').version")
          node -e "if(require('./package.json').version !== require('./manifest.json').version) process.exit(1)"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists; leaving it unchanged."
            exit 0
          fi
          cat > release-notes.md <<'NOTES'
          Adds a Font selector under Style Settings for all graph text.

          - Default: inherit the Obsidian theme font.
          - Handwritten: bundled Virgil font, available offline without Excalidraw.
          - Custom: enter a font installed on your device, e.g. Segoe Print.
          - Works with Standard and Excalidraw-style graphs across all layouts.
          - Existing notes retain the theme font by default.

          YAML/API options: `font: handwritten` or `font: custom` with `customFont: Segoe Print`.
          Virgil by Ellinor Rapp is included under SIL OFL 1.1; its license is embedded in styles.css.
          BRAT repository: `quannguyen83/obsidian-contribution-graph`.
          Validation: TypeScript build and DOM regression tests passed; not visually verified in Obsidian.
          NOTES
          gh release create "$version" main.js manifest.json styles.css \
            --target "$GITHUB_SHA" --title "$version — Sketch Contribution Graph" \
            --notes-file release-notes.md --latest
