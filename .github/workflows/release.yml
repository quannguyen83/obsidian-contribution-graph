name: Release Obsidian plugin

on:
  push:
    branches: [master]
    paths: [manifest.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install, test and build
        run: |
          npm ci
          node tests/sketch-smoke.cjs
          npm run build
      - name: Publish BRAT release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version=$(node -p "require('./manifest.json').version")
          node -e "if(require('./package.json').version !== require('./manifest.json').version) process.exit(1)"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists; leaving it unchanged."
            exit 0
          fi
          cat > release-notes.md <<'NOTES'
          Fixes faint outlines when Thin strokes are used in small heatmap cells.

          - Outlines retain a minimum 1px width and no longer shrink with the SVG.
          - Interior hatch strokes keep the selected Thin/Medium/Thick weight.
          - Includes the Cartoonist rounded-corner fix from 0.13.1.

          BRAT repository: `quannguyen83/obsidian-contribution-graph`.
          Validation: TypeScript build and DOM regression tests passed; not visually verified in Obsidian.
          NOTES
          gh release create "$version" main.js manifest.json styles.css \
            --target "$GITHUB_SHA" --title "$version — Sketch Contribution Graph" \
            --notes-file release-notes.md --latest
